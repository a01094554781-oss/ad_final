      window.getWordOfTheDay = function() {
        return new Promise((resolve) => {
            if (window.availableIndices.length === 0) {
               window.availableIndices = Array.from({ length: window.WORD_DATABASE.length }, (_, i) => i);
            }
            const randomIndexInPool = Math.floor(Math.random() * window.availableIndices.length);
            const wordIndex = window.availableIndices[randomIndexInPool];

            resolve(window.WORD_DATABASE[wordIndex]);
        });
